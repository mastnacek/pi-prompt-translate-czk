name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # devDependencies are pinned to the same minor line as the engine this
      # plugin is loaded into; a stale pin type-checks against an API the
      # running pi does not have.
      - run: npm ci
      - run: npm run check
      - run: npm test
